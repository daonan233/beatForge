<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">节奏工坊 BeatForge</title>
  <defs>
    <radialGradient id="surface" cx="34%" cy="22%" r="88%">
      <stop offset="0" stop-color="#1b2230" />
      <stop offset="0.48" stop-color="#0d1119" />
      <stop offset="1" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="frame" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#667184" />
      <stop offset="0.45" stop-color="#2f3744" />
      <stop offset="1" stop-color="#171d27" />
    </linearGradient>
    <linearGradient id="beam" x1="20" y1="17" x2="48" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ff78" />
      <stop offset="0.48" stop-color="#baff43" />
      <stop offset="1" stop-color="#70f2b3" />
    </linearGradient>
    <linearGradient id="tapCyan" x1="9" y1="41" x2="29" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cf5ff" />
      <stop offset="0.52" stop-color="#47cfe9" />
      <stop offset="1" stop-color="#627eff" />
    </linearGradient>
    <linearGradient id="tapPink" x1="33" y1="35" x2="54" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2a2ff" />
      <stop offset="0.5" stop-color="#d878f7" />
      <stop offset="1" stop-color="#ff719a" />
    </linearGradient>
    <filter id="beamGlow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="tapGlow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#surface)" stroke="url(#frame)" stroke-width="4" />
  <path d="M22 44V20L46 14V38" fill="none" stroke="url(#beam)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#beamGlow)" />
  <path d="M23 27L45 21" fill="none" stroke="#ddff72" stroke-width="4.5" stroke-linecap="round" />

  <g filter="url(#tapGlow)">
    <path d="M8.5 43.5L24.5 40.2L29.2 46.5L11.6 50.7Z" fill="url(#tapCyan)" stroke="#dffcff" stroke-width="1.25" stroke-linejoin="round" />
    <path d="M33 37.4L49.3 34.1L54.4 40.4L36.5 44.7Z" fill="url(#tapPink)" stroke="#fff0ff" stroke-width="1.25" stroke-linejoin="round" />
  </g>
  <path d="M11.2 44.2L24 41.6M35.8 38L48.7 35.4" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.72" />
  <path d="M51 10V16M48 13H54" stroke="#f7faff" stroke-width="2" stroke-linecap="round" />
</svg>
